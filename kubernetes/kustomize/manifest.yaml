# Source: scenescape-chart/templates/ntp-dep.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-ntp-dep
  labels:
    app: release-name-ntpserv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-name-ntpserv
  template:
    metadata:
      labels:
        app: release-name-ntpserv
    spec:
      shareProcessNamespace: true
      initContainers:
        - command:
          - sh
          - -c
          - touch /tmp/healthy
          image: busybox
          name: init-healthy-file
          volumeMounts:
          - name: healthy-file
            mountPath: /tmp
      containers:
        - image: dockurr/chrony
          name: release-name-ntpserv
          env:
          - name: NTP_SERVERS
            value: 0.pool.ntp.org,1.pool.ntp.org,2.pool.ntp.org,3.pool.ntp.org
          imagePullPolicy: Always
          ports:
          - containerPort: 123
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/healthy
            periodSeconds: 1
          volumeMounts:
          - name: healthy-file
            mountPath: /tmp
          resources: {}
      restartPolicy: Always
      volumes:
      - name: healthy-file
        emptyDir: {}
status: {}
