        volumeMounts:
        - mountPath: /workspace/media
          name: media-storage
      - name: chown-model-initcontainer
        image: busybox
        command: ["/bin/sh", "-c", "chown -R 33:33 /workspace"]
        volumeMounts:
        - mountPath: /workspace/models
          name: models-storage
      containers:
        - args:
          - webserver
          - --dbhost
          - pgserver.default
          - --broker
          - broker.default
          - --brokerauth
          - /run/secrets/browser.auth
          - --brokerrootcert
          - /run/secrets/certs/scenescape-ca.pem
          image: 10.190.167.131:5001/scenescape-manager:1.4.0-alpha
          name: release-name-web
          env:
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
          ports:
          - containerPort: 443
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/healthy
            periodSeconds: 1
          resources: {}
          volumeMounts:
          - mountPath: /dev/fuse
