          kubectl delete secret release-name-django -n default;
          kubectl delete secret release-name-scenescape-broker.key -n default;
          kubectl delete secret release-name-scenescape-broker.crt -n default;
          kubectl delete secret release-name-scenescape-ca.pem -n default;
          kubectl delete secret release-name-percebro.auth -n default;
          kubectl delete secret release-name-controller.auth -n default;
          kubectl delete secret release-name-browser.auth -n default;
          kubectl delete secret release-name-calibration.auth -n default;
          kubectl delete pvc release-name-pgserver-pvc -n default;
          kubectl delete pvc release-name-media-pvc -n default;
          kubectl delete pvc release-name-datasets-pvc -n default;
          kubectl delete pvc release-name-models-pvc -n default;
          kubectl delete pvc release-name-videos-pvc -n default;
          kubectl delete pvc release-name-sample-data-pvc -n default;
          kubectl delete pvc release-name-controller-pvc -n default;
          kubectl delete pvc release-name-user-access-config-pvc -n default;
          kubectl delete deploy -l release=release-name -n default;
          kubectl delete job scenescape-sources -n default --ignore-not-found;
        image: 10.190.167.131:5001/init-secrets:1.4.0-alpha
        name: init-secrets-container
