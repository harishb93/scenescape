# Source: scenescape-chart/templates/secrets-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: release-name-init-secrets
  namespace: default
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    spec:
      containers:
      - command: ["/bin/bash", "-c"]
        args:
        - echo "Generating secrets.";
          make -C /root/ secrets RELEASE=${RELEASE} CERTDOMAIN=${CERTDOMAIN} CERTPASS=$(openssl rand -base64 33);
          echo "Generated secrets.";
          echo "Creating Kubernetes secrets";
          kubectl create secret generic release-name-certs --from-file=/root/secrets/certs -n default;
          kubectl create secret generic release-name-django --from-file=/root/secrets/django -n default;
          kubectl create secret generic release-name-scenescape-broker.key --from-file=/root/secrets/certs/scenescape-broker.key -n default;
          kubectl create secret generic release-name-scenescape-broker.crt --from-file=/root/secrets/certs/scenescape-broker.crt -n default;
          kubectl create secret generic release-name-scenescape-ca.pem --from-file=/root/secrets/certs/scenescape-ca.pem -n default;
          kubectl create secret generic release-name-percebro.auth --from-file=/root/secrets/percebro.auth -n default;
          kubectl create secret generic release-name-controller.auth --from-file=/root/secrets/controller.auth -n default;
          kubectl create secret generic release-name-browser.auth --from-file=/root/secrets/browser.auth -n default;
          kubectl create secret generic release-name-calibration.auth --from-file=/root/secrets/calibration.auth -n default;
          echo "Secrets successfully generated.";
          echo "Copying user-access-config.";
          cp /root/docker/user_access_config.json /root/user-access-config-storage/;
          chown -R 1000:1000 /root/user_access_config-storage;
          echo "Copied user-access-config.";
        image: 10.190.167.131:5001/init-secrets:1.4.0-alpha
        name: init-secrets-container
        imagePullPolicy: Always
        volumeMounts:
        - mountPath: /root/user-access-config-storage
          name: user-access-config-storage
        env:
        - name: RELEASE
          value: release-name-
        - name: CERTDOMAIN
          value: default
      restartPolicy: Never
      volumes:
      - name: user-access-config-storage
        persistentVolumeClaim:
          claimName: release-name-user-access-config-pvc
      serviceAccountName: release-name-secret-writer-sa
  backoffLimit: 3
