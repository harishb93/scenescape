            name: scenescape-broker-key
            readOnly: true
            subPath: scenescape-broker.key
          - mountPath: /run/secrets/scenescape-broker.crt
            name: scenescape-broker-crt
            readOnly: true
            subPath: scenescape-broker.crt
      restartPolicy: Always
      volumes:
