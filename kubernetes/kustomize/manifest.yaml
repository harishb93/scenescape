# Source: scenescape-chart/templates/kubeclient-dep.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-kubeclient-dep
  labels:
    app: release-name-kubeclient
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-name-kubeclient
  template:
    metadata:
      labels:
        app: release-name-kubeclient
    spec:
      shareProcessNamespace: true
      initContainers:
      - name: wait-for-broker-initcontainer
        image: busybox
        command: ["/bin/sh", "-c", "until nc -vz broker.default 1883; do sleep 1; done"]
      - name: wait-for-web-initcontainer
        image: busybox
        command: ["/bin/sh", "-c", "until wget -q --spider http://web.default; do sleep 1; done"]
      containers:
        - args:
          - ./manage.py
          - kubecommand
          - --broker
          - broker.default
          - --resturl
          - https://web.default/api/v1
          - --ntp
          - ntpserv.default
          - --auth
          - /run/secrets/percebro.auth
          image: 10.190.167.131:5001/scenescape-manager:1.4.0-alpha
          name: release-name-kubeclient
          env:
          - name: KUBERNETES_NAMESPACE
            value: default
          - name: HELM_RELEASE
            value: release-name
          - name: HELM_REPO
            value: 10.190.167.131:5001
          - name: HELM_IMAGE
            value: scenescape-percebro
          - name: HELM_TAG
            value: "1.4.0-alpha"
          imagePullPolicy: Always
          readinessProbe:
            exec:
              command:
              - cat
              - /tmp/healthy
            periodSeconds: 1
          resources: {}
          volumeMounts:
          - mountPath: /run/secrets/certs
            name: certs
            readOnly: true
          - mountPath: /run/secrets/django
            name: django
            readOnly: true
          - mountPath: /run/secrets/percebro.auth
            name: percebro-auth
            readOnly: true
            subPath: percebro.auth
      restartPolicy: Always
      serviceAccountName: release-name-kubeclient-sa
      volumes:
      - name: certs
        secret:
          secretName: release-name-certs
      - name: django
        secret:
          secretName: release-name-django
      - name: percebro-auth
        secret:
          secretName: release-name-percebro.auth
status: {}
